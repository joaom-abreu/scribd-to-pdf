[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "scribd-to-pdf"
version = "0.1.0"
description = "Aplicativo para reunir páginas de documentos do Scribd em um único PDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.63.0",
    "img2pdf==0.6.3",
    "pypdf==6.20.1",
]

[project.scripts]
scribd-to-pdf = "scribd_to_pdf.cli:main"
scribd-to-pdf-gui = "scribd_to_pdf.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "Pillow==12.3.0",
]
build = [
    "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]